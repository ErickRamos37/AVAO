<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AVAO · Medidas</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <a href="/" class="brand">AVAO</a>
        <p>Registro de medidas</p>
      </header>

      <section id="capture">
        <h1>Nuevo pedido</h1>
        <p>Ventana California por mitad. Ingresa el ancho y el alto del hueco en pulgadas.</p>
        <form id="order-form">
          <label for="width">Ancho</label>
          <input id="width" name="ancho" type="text" required inputmode="text" placeholder="Ej. 24 1/4 1/16" autocomplete="off">
          <label for="height">Alto</label>
          <input id="height" name="alto" type="text" required inputmode="text" placeholder="Ej. 26 1/2" autocomplete="off">
          <button type="submit">Guardar pedido</button>
        </form>
        <p class="hint">Puedes escribir un entero o sumar fracciones de 1/2, 1/4, 1/8 y 1/16.</p>
      </section>

      <section id="detail" hidden>
        <h1 id="order-title"></h1>
        <p>Medidas del hueco en pulgadas</p>
        <div id="order-content"></div>
        <a href="/">Crear otro pedido</a>
      </section>

      <p id="message" role="alert" hidden></p>
      <p id="error-return" hidden><a href="/">Volver al inicio</a></p>
    </main>
  </body>
</html>
