<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AVAO · Costos de insumos</title>
    <link rel="stylesheet" href="/static/styles.css?v=hu37-barra5">
    <script src="/static/costos.js?v=hu14-pagos" defer></script>
    <script src="/static/navigation.js?v=hu37-inicio" defer></script>
  </head>
  <body>
    <main>
      <header>
        <a href="/" class="brand">AVAO</a>
        <div class="global-menu">
          <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="global-navigation">☰ Menú</button>
          <nav id="global-navigation" aria-label="Navegación principal" hidden>
            <a href="/">Dashboard</a>
            <a href="/?vista=nuevo">Nuevo presupuesto</a>
            <a href="/?vista=pedidos">Pedidos</a>
            <a href="/?vista=presupuestos">Presupuestos</a>
            <a href="/costos">Inventario</a>
            <a href="/?vista=historico">Histórico</a>
          </nav>
        </div>
      </header>
      <h1>Costos de compra</h1>
      <p>Los valores guardados se usarán en cálculos nuevos. Los costos pendientes quedan vacíos hasta que se conozcan.</p>
      <p id="cost-message" role="alert" hidden></p>
      <form id="inventory-form">
        <div id="cost-list">Cargando costos…</div>
        <p><label for="profit">Ganancia común (%)</label> <input id="profit" type="number" min="1" max="100" step="1" required></p>
        <p><label for="waste-threshold">Umbral de merma de aluminio (%)</label> <input id="waste-threshold" type="number" min="0" max="100" step="1" required></p>
        <p>Con 0 % no se recupera merma.</p>
        <p><label for="glass-waste-threshold">Umbral de merma de vidrio (%)</label> <input id="glass-waste-threshold" type="number" min="0" max="100" step="1" required></p>
        <p><label for="minimum-advance">Anticipo mínimo (%)</label> <input id="minimum-advance" type="number" min="1" max="100" step="1" required></p>
        <button type="submit">Guardar</button>
      </form>
      <dialog id="unsaved-dialog">
        <p>Hay cambios sin guardar. ¿Qué deseas hacer?</p>
        <button type="button" data-action="save">Guardar y salir</button>
        <button type="button" data-action="discard">Descartar y salir</button>
        <button type="button" data-action="stay">Permanecer</button>
      </dialog>
    </main>
  </body>
</html>
